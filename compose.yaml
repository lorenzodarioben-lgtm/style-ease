services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: style
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only}
      POSTGRES_DB: style_ease
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - black-label-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U style -d style_ease"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    profiles: ["app"]
    stop_grace_period: 15s
    environment:
      APP_ENV: development
      APP_ORIGIN: http://127.0.0.1:8080
      DATABASE_URL: postgres://style:${POSTGRES_PASSWORD:-local_demo_only}@db:5432/style_ease?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  black-label-postgres:
